<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Bike Fit Explorer · Compare fits &amp; open in BikeGeoCalc</title>
  <meta name="description" content="Overlay two bike fits, compare saddle, bar and frame geometry side by side, and open the comparison in BikeGeoCalc.">
  <meta name="theme-color" content="#f1f0ec" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0e0f11" media="(prefers-color-scheme: dark)">
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="shortcut icon" href="favicon.ico">

  <!-- Apply the saved/system theme before first paint -->
  <script>
    (function () {
      var t = null;
      try { t = localStorage.getItem('bikefits:theme'); } catch (e) {}
      if (t !== 'light' && t !== 'dark') t = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
      document.documentElement.setAttribute('data-theme', t);
    })();
  </script>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@100..125,400..800&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
  <link rel="stylesheet" href="assets/css/styles.css">
  <script type="module" src="assets/js/app.js"></script>
</head>
<body>
  <a class="skip-link" href="#stage">Skip to comparison</a>

  <header class="topbar">
    <a class="brand" href="./" aria-label="Bike Fit Explorer home">
      <svg class="brand-mark" viewBox="0 0 32 32" aria-hidden="true" fill="none" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
        <circle class="wheel-a" cx="9" cy="20" r="6.5"/>
        <circle class="wheel-b" cx="23" cy="20" r="6.5"/>
        <path class="frame" d="M9 20 13.2 10.5H20.5M13.2 10.5 16.5 20 20.5 10.5 23 20" stroke-width="1.9"/>
      </svg>
      <h1 class="brand-name">Bike Fit Explorer</h1>
    </a>
    <p class="topbar-tagline">Overlay two fits, compare every number, open in BikeGeoCalc</p>
    <div class="topbar-actions">
      <button id="theme-toggle" class="icon-btn" type="button" aria-label="Switch theme"></button>
      <a class="icon-btn" href="https://github.com/randin/bikefits" target="_blank" rel="noopener" aria-label="View source on GitHub" title="View on GitHub">
        <svg class="icon" viewBox="0 0 16 16" aria-hidden="true"><path fill="currentColor" stroke="none" d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0 0 16 8c0-4.42-3.58-8-8-8z"/></svg>
      </a>
    </div>
  </header>

  <main class="app">
    <!-- Fit library -->
    <aside class="sidebar" aria-labelledby="library-title">
      <div class="sidebar-head">
        <h2 id="library-title" class="sidebar-title">Fits <span id="fit-count" class="count"></span></h2>
        <div class="search" role="search">
          <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="m20 20-4.2-4.2"/></svg>
          <input id="search" type="search" placeholder="Search fits" autocomplete="off" spellcheck="false" aria-label="Search fits" aria-controls="fit-list">
          <kbd aria-hidden="true">/</kbd>
          <button id="search-clear" class="icon-btn sm search-clear" type="button" aria-label="Clear search">
            <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M18 6 6 18M6 6l12 12"/></svg>
          </button>
        </div>
      </div>
      <div id="fit-list" class="fit-list" aria-busy="true">
        <div class="skeleton"></div><div class="skeleton"></div><div class="skeleton"></div>
        <div class="skeleton"></div><div class="skeleton"></div><div class="skeleton"></div>
      </div>
      <button id="dropzone" class="dropzone" type="button">
        <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 15V4"/><path d="m7.5 8.5 4.5-4.5 4.5 4.5"/><path d="M4 15v3a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-3"/></svg>
        <span><strong>Add a fit</strong>Drop BikeGeoCalc JSON or browse</span>
      </button>
      <input id="file-input" type="file" accept=".json,application/json" multiple hidden>
    </aside>

    <!-- Selected fits + actions -->
    <section class="compare-bar" aria-label="Selected fits">
      <div class="slots">
        <div id="slot-a" class="slot slot-a"></div>
        <button id="swap" class="swap-btn" type="button" aria-label="Swap A and B" title="Swap A and B" disabled>
          <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 4 3.5 7.5 7 11"/><path d="M3.5 7.5h17"/><path d="m17 13 3.5 3.5L17 20"/><path d="M20.5 16.5h-17"/></svg>
        </button>
        <div id="slot-b" class="slot slot-b"></div>
      </div>
      <div class="compare-actions">
        <button id="copy-link" class="btn btn-secondary" type="button" disabled>
          <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><rect x="8.5" y="8.5" width="12" height="12" rx="2.5"/><path d="M15.5 8.5V6a2.5 2.5 0 0 0-2.5-2.5H6A2.5 2.5 0 0 0 3.5 6v7A2.5 2.5 0 0 0 6 15.5h2.5"/></svg>
          <span>Copy link</span>
        </button>
        <a id="open-bgc" class="btn btn-primary" target="_blank" rel="noopener" aria-disabled="true" tabindex="-1">
          <span class="label">Open in BikeGeoCalc</span>
          <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M14 4h6v6"/><path d="M20 4 11 13"/><path d="M18 14v4a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4"/></svg>
        </a>
      </div>
    </section>

    <!-- Geometry overlay -->
    <figure id="stage" class="stage" tabindex="-1">
      <div class="stage-head">
        <div id="legend" class="legend"></div>
        <div class="segmented" role="radiogroup" aria-label="Align bikes at">
          <span class="segmented-label" aria-hidden="true">Align</span>
          <button type="button" role="radio" aria-checked="true" data-align="bb">BB</button>
          <button type="button" role="radio" aria-checked="false" data-align="axle">Rear axle</button>
        </div>
      </div>
      <div class="stage-canvas">
        <canvas id="scene" role="img" aria-label="Bike geometry overlay"></canvas>
        <div id="stage-empty" class="stage-empty">
          <div class="stage-empty-card">
            <h2>Compare two fits</h2>
            <p>Pick a fit as <strong>A</strong>, then flick through others as <strong>B</strong>. A stays put as your reference.</p>
            <button id="try-example" class="btn btn-secondary" type="button" hidden></button>
          </div>
        </div>
      </div>
      <figcaption id="stage-caption" class="stage-caption" aria-live="polite"></figcaption>
      <div id="shift" class="shift" hidden></div>
    </figure>

    <!-- Measurements -->
    <section id="specs" class="specs" aria-labelledby="specs-title" hidden>
      <div class="specs-head">
        <h2 id="specs-title" class="specs-title">Measurements <small id="specs-note"></small></h2>
        <label class="switch" id="only-diff-wrap">
          <input id="only-diff" type="checkbox">
          <span class="switch-track" aria-hidden="true"></span>
          <span>Only differences</span>
        </label>
      </div>
      <div id="spec-cards" class="spec-cards"></div>
    </section>
  </main>

  <div id="drop-overlay" class="drop-overlay" aria-hidden="true">
    <div class="drop-card">
      <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 15V4"/><path d="m7.5 8.5 4.5-4.5 4.5 4.5"/><path d="M4 15v3a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-3"/></svg>
      <strong>Drop to add fit</strong>
      <span>BikeGeoCalc JSON exports</span>
    </div>
  </div>

  <div id="toasts" class="toasts" aria-live="polite"></div>
</body>
</html>
